name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test
        run: go test ./...

      - name: Build cmd/*
        run: |
          for d in cmd/*/; do
            pkg="${d%/}"
            echo "building ./$pkg"
            go build -o /dev/null "./$pkg"
          done

  smoke:
    name: Smoke suite
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      # Stable secrets for non-strict smoke APIs
      JWT_SECRET: "ci-smoke-jwt-secret-xx"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl python3

      - name: Smoke-all (no live MinIO)
        run: make smoke-all

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            /tmp/aihub-*.log
            /tmp/aihub-*-api.log
          if-no-files-found: ignore
