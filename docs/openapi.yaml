        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/jobs/{id}/heartbeat:
    post:
      tags: [jobs]
      summary: Refresh BYOC job lease while running
      description: |
        Runner heartbeat. Jobs without a heartbeat for `AI_CLOUDHUB_JOB_LEASE_SEC`
        (default 300) are returned to `pending` with note `released: lease expired`
        on the next claim path (still BYOC — no platform pool).
      operationId: heartbeatJob
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job with updated heartbeat_at
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/jobs/{id}/cancel:
    post:
      tags: [jobs]
