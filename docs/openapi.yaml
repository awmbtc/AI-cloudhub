openapi: 3.0.3
info:
  title: AI-cloudhub HTTP API
  version: 0.2.10
  description: |
    Control-plane HTTP API for **AI-cloudhub** — a multi-cloud disk OS for humans and agents.

    **Model**
    - **BYOS**: user brings object storage (R2 / S3 / OSS / COS / B2 / MinIO / …). Bytes do not transit the control plane.
    - **BYOC**: cloud Agent jobs run on the **user's own compute** via `cmd/runner` / hubd.
    - **No platform runner pool**: the product does **not** operate a large multi-tenant runner fleet
      (decision **D-001**). Jobs are claimed only by runners authenticated as the job owner.

    **Auth**: most `/v1/*` routes require `Authorization: Bearer <token>` from `POST /v1/auth/login`
    (human session) or `POST /v1/agents/{id}/token` (agent capability token with scopes).
    Admin routes additionally require `role=admin` (first registered user is admin) and a human session.

    **Agent scopes (v0)**: `drive.read`, `drive.write`, `job.run`, `provider.read`, `provider.write`.
    Human tokens are unrestricted for API scope checks. Agents are also constrained by
    `allowed_drive_ids` and optional path prefixes / external policy file.

    **Default listen**: `:8080` (`HTTP_ADDR`). Routes registered in `internal/httpserver/server.go`.

    **Optional routes**
    - `/v1/agents*` when agent service is wired (default in `cmd/api`).
    - `/v1/devices*` when device service is wired (default in `cmd/api`).
    - `/v1/jobs*` when job service is wired (default in `cmd/api`).
    - **Stage C** (default in `cmd/api`): `/v1/memory*`, `/v1/marketplace*`, `/v1/purchases*`,
      `/v1/connectors*`, `/v1/lineage`, `/v1/graph`, `/v1/modules`, `/v1/webhooks/stripe`.
    - `/v1/workspaces*` only when `ENABLE_PLATFORM_S3=1` (legacy platform S3 workspace; not the primary BYOS path).
  contact:
    name: AI-cloudhub
  license:
    name: Apache-2.0

servers:
  - url: http://127.0.0.1:8080
    description: Local default

tags:
  - name: health
    description: Liveness, readiness, metrics, host runtime preflight
  - name: auth
    description: Register, login, current user, password
  - name: agents
    description: Agent identity CRUD and capability tokens (human session only for management)
  - name: admin
    description: Admin-only user list, role change, audit, policy status
  - name: providers
    description: Object-storage provider catalog and credential bindings
  - name: drives
    description: Logical drives (provider + bucket + prefix)
  - name: bindings
    description: Desired/actual mount state on a device (agent drive allowlist + drive.read/write scopes)
  - name: sessions
    description: Short-lived STS mount sessions and refresh
  - name: jobs
    description: Durable BYOC job queue (user runners only; no platform pool)
  - name: devices
    description: hubd/runtime device registration (optional service; human session only)
  - name: memory
    description: Stage C Memory Kernel (working|episodic|semantic; optional client embeddings)
  - name: marketplace
    description: Stage C catalog, install, checkout (no PCI card data on control plane)
  - name: connectors
    description: Git/DB/SaaS connector bindings (non-secret config; materialize on BYOC runner)
  - name: lineage
    description: Stage C append-only data lineage events
  - name: graph
    description: Stage C identity graph edges
  - name: modules
    description: Logical module registry (monolith default; D-002)
  - name: purchases
    description: Marketplace purchases list and dev pay stub
  - name: webhooks
    description: Payment provider webhooks (Stripe signature)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque token from POST /v1/auth/login or POST /v1/agents/{id}/token

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: missing bearer token

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
          description: First registered user is admin

    AuthCredentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          description: Alphanumeric start; [a-zA-Z0-9._-]
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Access bearer token
        refresh_token:
          type: string
          description: Opaque refresh token (rotated on /v1/auth/refresh)
        expires_in:
          type: integer
          description: Access token lifetime in seconds
        token_type:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'

    Me:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
        principal:
          type: string
          enum: [human, agent]
          description: human session vs agent capability token
        agent_id:
          type: string
          description: Present when principal is agent
        scopes:
          type: array
          items: { type: string }
          description: Capability scopes when principal is agent

    ChangePassword:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    Healthz:
      type: object
      properties:
        status:
          type: string
          example: ok
        product:
          type: string
          example: AI-cloudhub
        batch_a:
          type: array
          items: { type: string }
        batch_b:
          type: array
          items: { type: string }
        batch_c:
          type: array
          items: { type: string }
        p0:
          type: array
          items: { type: string }
        p1:
          type: array
          items: { type: string }
        p2:
          type: array
          items: { type: string }
        p3:
          type: array
          items: { type: string }

    Readyz:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        error:
          type: string
          description: Present when store Ping fails

    RuntimeCheck:
      type: object
      description: Host preflight for hubd/runner (rclone, FUSE/WinFsp hints)
      properties:
        os:
          type: string
        arch:
          type: string
        rclone_ok:
          type: boolean
        rclone_path:
          type: string
        rclone_version:
          type: string
        fuse_hint:
          type: string
        winfsp_ok:
          type: boolean
        winfsp_hint:
          type: string
        install_hint:
          type: string
        ok:
          type: boolean
        warnings:
          type: array
          items: { type: string }
        errors:
          type: array
          items: { type: string }

    ProviderMeta:
      type: object
      properties:
        type:
          type: string
          enum: [s3, r2, minio, b2, oss, cos, qiniu, oracle]
        name:
          type: string
        batch:
          type: string
        s3_compat:
          type: boolean
        implemented:
          type: boolean
        fields:
          type: array
          items: { type: string }
        notes:
          type: string

    ProviderCatalog:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProviderMeta'
        batch_a:
          type: array
          items: { type: string }
        batch_b:
          type: array
          items: { type: string }
        docs:
          type: string
          example: docs/VENDORS.md

    ProviderCredentials:
      type: object
      required: [access_key, secret_key]
      properties:
        access_key:
          type: string
        secret_key:
          type: string
          format: password
        endpoint:
          type: string
          description: Host or URL (vendor-dependent)
        region:
          type: string
        account_id:
          type: string
          description: R2 account id when endpoint omitted
        force_path_style:
          type: boolean
          nullable: true
        use_ssl:
          type: boolean
          nullable: true

    ProviderCreate:
      type: object
      required: [name, type, credentials]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [s3, r2, minio, b2, oss, cos, qiniu, oracle]
        credentials:
          $ref: '#/components/schemas/ProviderCredentials'

    ProviderPublic:
      type: object
      description: Provider without secrets
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        endpoint:
          type: string
        region:
          type: string
        account_id:
          type: string

    ProviderHealth:
      type: object
      properties:
        ok:
          type: boolean
        provider_id:
          type: string
        type:
          type: string
        endpoint:
          type: string
        latency_ms:
          type: integer
        bucket_count:
          type: integer
        message:
          type: string

    Drive:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        provider_id:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        mount_point:
          type: string
          description: "Default hint, e.g. G: or /workspace"
        region:
          type: string
          description: Optional scheduling/locality hint
        created_at:
          type: string
          format: date-time

    DriveCreate:
      type: object
      required: [name, provider_id, bucket]
      properties:
        name:
          type: string
        provider_id:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        mount_point:
          type: string
        region:
          type: string

    Binding:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        drive_id:
          type: string
        device_id:
          type: string
        mount_point:
          type: string
        mode:
          type: string
          description: mount | sync_workspace
        desired:
          type: string
          enum: [mounted, unmounted]
        actual:
          type: string
          enum: [unknown, mounted, unmounted, degraded, error]
        last_error:
          type: string
        updated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    BindingCreate:
      type: object
      required: [drive_id]
      properties:
        drive_id:
          type: string
        device_id:
          type: string
          description: Defaults to "default"
        mount_point:
          type: string
        mode:
          type: string
          default: mount
        desired:
          type: string
          enum: [mounted, unmounted]
          default: mounted

    BindingReport:
      type: object
      properties:
        actual:
          type: string
          enum: [unknown, mounted, unmounted, degraded, error]
        last_error:
          type: string

    BindingDesired:
      type: object
      required: [desired]
      properties:
        desired:
          type: string
          enum: [mounted, unmounted]

    MountSpec:
      type: object
      properties:
        remote_name:
          type: string
        remote_path:
          type: string
        mount_point:
          type: string
        rclone_conf:
          type: string
          description: rclone config text (may contain short-lived secrets in session responses)
        mode:
          type: string

    Manifest:
      type: object
      description: Machine-readable workspace contract for agents
      properties:
        version:
          type: integer
        product:
          type: string
        drive_id:
          type: string
        mount_point:
          type: string
        mode:
          type: string
        write_barrier:
          type: string
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        env:
          type: object
          additionalProperties:
            type: string
        agent:
          type: object
          properties:
            allowed_paths:
              type: array
              items: { type: string }
            deny_upload_tools:
              type: boolean
            instructions:
              type: string

    Session:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        drive_id:
          type: string
        device_id:
          type: string
        mount_point:
          type: string
        mode:
          type: string
        expires_at:
          type: string
          format: date-time
        spec:
          $ref: '#/components/schemas/MountSpec'
        manifest:
          $ref: '#/components/schemas/Manifest'
        token:
          type: string
          description: Opaque session token for refresh
        source:
          type: string
          description: embedded | refresh | minio_sts | aws_sts
        note:
          type: string

    SessionBundle:
      type: object
      description: Runtime mount grant (STS + drive + manifest)
      properties:
        binding:
          $ref: '#/components/schemas/Binding'
        drive:
          $ref: '#/components/schemas/Drive'
        session:
          $ref: '#/components/schemas/Session'
        manifest:
          $ref: '#/components/schemas/Manifest'
        spec:
          $ref: '#/components/schemas/MountSpec'
        note:
          type: string
          description: Includes BYOC guidance; no platform large pool

    IssueSessionRequest:
      type: object
      properties:
        mount_point:
          type: string
        device_id:
          type: string
        mode:
          type: string
          description: mount | sync_workspace

    RefreshSessionRequest:
      type: object
      required: [session_token, drive_id]
      properties:
        session_token:
          type: string
        drive_id:
          type: string

    Barrier:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        drive_id:
          type: string
        device_id:
          type: string
        status:
          type: string
          enum: [pending, ok, failed]
        note:
          type: string
        created_at:
          type: string
          format: date-time
        done_at:
          type: string
          format: date-time

    BarrierComplete:
      type: object
      properties:
        drive_id:
          type: string
          description: Overwritten from path by server
        device_id:
          type: string
        status:
          type: string
          enum: [ok, failed]
          default: ok
        note:
          type: string

    MountBundle:
      type: object
      description: Legacy rclone conf helper; prefer POST .../session
      properties:
        drive:
          $ref: '#/components/schemas/Drive'
        provider:
          $ref: '#/components/schemas/ProviderPublic'
        rclone_conf:
          type: string
        remote_name:
          type: string
        remote_path:
          type: string
        spec:
          $ref: '#/components/schemas/MountSpec'
        commands:
          type: object
          properties:
            write_conf: { type: string }
            mount: { type: string }
            unmount: { type: string }
        note:
          type: string

    Job:
      type: object
      description: |
        Work item for a **user-side BYOC runner**. Creating a job does not schedule onto
        a platform-owned pool; claim with the owner's token via POST /v1/jobs/{id}/claim
        or POST /v1/jobs/next/claim.
        List filters: `agent_id` (creator) and `claimed_by_agent_id` (claimer) on GET /v1/jobs
        (ignored when `status=pending`). On claim, `claimed_by_agent_id` is set from the
        principal when using an agent token.
      properties:
        id:
          type: string
        user_id:
          type: string
        drive_id:
          type: string
        binding_id:
          type: string
        agent_id:
          type: string
          description: Creator agent_id set by control plane from principal (empty if human)
        claimed_by_agent_id:
          type: string
          description: Agent that last claimed the job (empty if human runner)
        mode:
          type: string
        command:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [pending, dispatched, running, succeeded, failed, cancelled]
        region_hint:
          type: string
        note:
          type: string
          description: Often includes "BYOC only … no platform large pool (D-001)"
        connector_id:
          type: string
          description: Optional Stage C connector (git clone / postgres|mysql env on runner)
        exit_code:
          type: integer
          nullable: true
          description: Process exit code when reported by runner (omitted if unknown)
        duration_ms:
          type: integer
          format: int64
          description: Runner wall time in milliseconds (0 if not reported)
        heartbeat_at:
          type: string
          format: date-time
          description: Last claim or runner heartbeat while status=running (omitted when idle/terminal)
        claimed_at:
          type: string
          format: date-time
          description: When job entered running (wall clock for hard timeout)
        timeout_sec:
          type: integer
          description: Hard wall-clock seconds from claim (0 = none)
        stdout:
          type: string
          description: Capped agent stdout tail (AI_CLOUDHUB_JOB_OUTPUT_MAX, default 8192)
        stderr:
          type: string
          description: Capped agent stderr tail
        stdout_truncated:
          type: boolean
        stderr_truncated:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    JobCreate:
      type: object
      required: [drive_id, command]
      properties:
        drive_id:
          type: string
        binding_id:
          type: string
        mode:
          type: string
          default: mount
        command:
          type: array
          items: { type: string }
          minItems: 1
          description: Runs on BYOC runner, not a platform pool
        region_hint:
          type: string
        note:
          type: string
        connector_id:
          type: string
          description: Optional git/postgres/mysql connector for runner materialization
        timeout_sec:
          type: integer
          description: Optional hard timeout seconds from claim (runner + API reclaim)

    JobComplete:
      type: object
      properties:
        ok:
          type: boolean
        note:
          type: string
        exit_code:
          type: integer
          description: Optional process exit code
        duration_ms:
          type: integer
          format: int64
          description: Optional wall duration in ms
        stdout:
          type: string
          description: Optional capped process stdout
        stderr:
          type: string
          description: Optional capped process stderr
        stdout_truncated:
          type: boolean
        stderr_truncated:
          type: boolean

    Agent:
      type: object
      description: |
        Agent identity owned by a user. Management APIs require a human session
        (`403 human session required` for agent tokens). Capability tokens are
        issued via `POST /v1/agents/{id}/token`.
      properties:
        id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, disabled]
        default_scopes:
          type: array
          items:
            type: string
            enum: [drive.read, drive.write, job.run, provider.read, provider.write]
          description: Used when token request omits scopes
        allowed_drive_ids:
          type: array
          items: { type: string }
          description: Drive allowlist; empty means no drives permitted for agent
        read_prefixes:
          type: array
          items: { type: string }
          description: Optional path prefixes for read policy
        write_prefixes:
          type: array
          items: { type: string }
          description: Optional path prefixes for write policy
        created_at:
          type: string
          format: date-time

    AgentCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 64
        description:
          type: string
        default_scopes:
          type: array
          items:
            type: string
            enum: [drive.read, drive.write, job.run, provider.read, provider.write]
          description: Defaults to [drive.read, drive.write] when omitted or empty
        allowed_drive_ids:
          type: array
          items: { type: string }
          description: Must belong to the owner when set
        read_prefixes:
          type: array
          items: { type: string }
        write_prefixes:
          type: array
          items: { type: string }

    AgentUpdate:
      type: object
      description: |
        Partial update (PUT or PATCH). When `allowed_drive_ids` is present in JSON
        (including `[]`), the server replaces the drive allowlist.
      properties:
        name:
          type: string
          maxLength: 64
        description:
          type: string
        status:
          type: string
          enum: [active, disabled]
        default_scopes:
          type: array
          items:
            type: string
            enum: [drive.read, drive.write, job.run, provider.read, provider.write]
        allowed_drive_ids:
          type: array
          items: { type: string }
          description: Replaces allowlist when present; empty array clears it
        set_drives:
          type: boolean
          description: |
            When true, replaces AllowedDriveIDs even if empty. The HTTP layer also
            sets this automatically when `allowed_drive_ids` is non-null in the body.
        read_prefixes:
          type: array
          items: { type: string }
        write_prefixes:
          type: array
          items: { type: string }

    AgentTokenRequest:
      type: object
      properties:
        scopes:
          type: array
          items:
            type: string
            enum: [drive.read, drive.write, job.run, provider.read, provider.write]
          description: Defaults to agent.default_scopes when omitted or empty
        ttl_min:
          type: integer
          description: Token lifetime in minutes; defaults to 60 when <= 0
          default: 60

    AgentTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: Bearer token for Authorization header
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          description: Lifetime in seconds
        agent_id:
          type: string
        scopes:
          type: array
          items: { type: string }


    MemoryEntry:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        agent_id: { type: string }
        drive_id: { type: string }
        layer:
          type: string
          enum: [working, episodic, semantic]
        key: { type: string }
        content: { type: string }
        meta: { type: object, additionalProperties: true }
        embedding:
          type: array
          items: { type: number }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    MarketplaceItem:
      type: object
      properties:
        id: { type: string }
        publisher_user_id: { type: string }
        name: { type: string }
        description: { type: string }
        kind:
          type: string
          enum: [agent_template, skill, manifest]
        version: { type: string }
        payload: { type: object, additionalProperties: true }
        public: { type: boolean }
        price_cents: { type: integer, format: int64 }
        currency: { type: string }
        created_at: { type: string, format: date-time }

    CheckoutResult:
      type: object
      description: Purchase plus Stripe hints; checkout_url is mock without STRIPE secret key
      properties:
        id: { type: string }
        user_id: { type: string }
        item_id: { type: string }
        amount_cents: { type: integer, format: int64 }
        currency: { type: string }
        status: { type: string, enum: [pending, paid, failed, refunded] }
        provider: { type: string }
        provider_ref: { type: string }
        stripe_metadata:
          type: object
          additionalProperties: { type: string }
        checkout_url: { type: string }
        session_id: { type: string }
        note: { type: string }
        created_at: { type: string, format: date-time }

    InstallResult:
      type: object
      properties:
        kind: { type: string }
        item_id: { type: string }
        name: { type: string }
        agent_id: { type: string, description: Set only for agent_template }
        scopes:
          type: array
          items: { type: string }
        payload: { type: object, additionalProperties: true }
        memory_id: { type: string }

    ConnectorBinding:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        type: { type: string, example: git }
        name: { type: string }
        config:
          type: object
          additionalProperties: true
          description: Non-secret JSON object (not base64)
        status: { type: string }
        created_at: { type: string, format: date-time }

    GraphEdge:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        subject: { type: string }
        relation: { type: string }
        object: { type: string }
        meta: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    LineageEvent:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        actor_id: { type: string }
        action: { type: string }
        entity: { type: string }
        parent: { type: string }
        detail: { type: string }
        created_at: { type: string, format: date-time }

    ModuleInfo:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        package: { type: string }
        process: { type: string }
        status: { type: string }

    Device:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        last_seen:
          type: string
          format: date-time

    DeviceRegister:
      type: object
      properties:
        id:
          type: string
          description: Optional; hubd should pass AI_CLOUDHUB_DEVICE_ID
        name:
          type: string

    AuditEvent:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        action:
          type: string
          example: auth.login
        target:
          type: string
        detail:
          type: string
        created_at:
          type: string
          format: date-time

    SetRole:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, user]

    ItemsUser:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'

    ItemsProvider:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProviderPublic'

    ItemsDrive:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Drive'

    InventoryEntry:
      type: object
      properties:
        key: { type: string }
        size: { type: integer, format: int64 }
        etag: { type: string }
        last_modified: { type: string, format: date-time }
        version_id: { type: string }
        is_latest: { type: boolean }
        delete_marker: { type: boolean }

    ObjectsInventory:
      type: object
      properties:
        drive_id: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        count: { type: integer }
        total_bytes: { type: integer, format: int64 }
        truncated: { type: boolean }
        with_versions: { type: boolean }
        entries:
          type: array
          items:
            $ref: '#/components/schemas/InventoryEntry'
        note: { type: string }

    ObjectKeyBody:
      type: object
      required: [key]
      properties:
        key: { type: string }
        version_id: { type: string }
        ttl_min:
          type: integer
          description: Presign TTL in minutes (default 15, max 1440 for service clamp)
          default: 15

    ObjectVersionHint:
      type: object
      properties:
        drive_id: { type: string }
        bucket: { type: string }
        key: { type: string }
        version_id: { type: string }
        hint: { type: string }
        note: { type: string }

    ObjectPresignGet:
      type: object
      properties:
        drive_id: { type: string }
        bucket: { type: string }
        key: { type: string }
        version_id: { type: string }
        url: { type: string, format: uri }
        expires_in: { type: integer, format: int64 }
        deadline:
          type: integer
          format: int64
          description: Unix expiry for qiniu_download tokens
        method:
          type: string
          enum: [s3_presign, qiniu_download]
          description: How the URL was minted
        note: { type: string }

    ObjectRestorePlan:
      type: object
      properties:
        drive_id: { type: string }
        key: { type: string }
        version_id: { type: string }
        cli_hint: { type: string }
        api_restore: { type: string }
        presign:
          $ref: '#/components/schemas/ObjectPresignGet'
        presign_error: { type: string }
        note: { type: string }

    Snapshot:
      type: object
      properties:
        id: { type: string }
        drive_id: { type: string }
        agent_id: { type: string }
        label: { type: string }
        note: { type: string }
        payload:
          type: object
          description: |
            Opaque JSON: kind, drive map, captured_at, optional manifest,
            optional objects inventory (include_objects).
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    SnapshotCreate:
      type: object
      properties:
        label: { type: string }
        note: { type: string }
        agent_id: { type: string }
        manifest:
          type: object
          additionalProperties: true
          description: Optional client-supplied manifest blob
        include_objects:
          type: boolean
          description: Capture live object inventory under drive prefix (metadata only)
        max_objects:
          type: integer
          description: Inventory cap (default 1000, max 5000)

    ItemsSnapshot:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'

    SnapshotDiff:
      type: object
      properties:
        drive_id: { type: string }
        snapshot_a: { type: string }
        snapshot_b: { type: string }
        a_has_objects: { type: boolean }
        b_has_objects: { type: boolean }
        error: { type: string }
        a_error: { type: string }
        b_error: { type: string }
        added:
          type: array
          items:
            type: object
            additionalProperties: true
        removed:
          type: array
          items:
            type: object
            additionalProperties: true
        changed:
          type: array
          items:
            type: object
            additionalProperties: true
        summary:
          type: object
          additionalProperties:
            type: integer

    SnapshotRestoreResult:
      type: object
      properties:
        snapshot_id: { type: string }
        drive_id: { type: string }
        label: { type: string }
        note: { type: string }
        created_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
        applied: { type: boolean }
        drive:
          $ref: '#/components/schemas/Drive'
        hint: { type: string }

    ItemsBinding:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Binding'

    ItemsAgent:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Agent'

    ItemsJob:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'

    ItemsDevice:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'

    ItemsAudit:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'

    ItemsBarrier:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Barrier'

    StatusDeleted:
      type: object
      properties:
        status:
          type: string
          example: deleted

    StatusOK:
      type: object
      properties:
        status:
          type: string
          example: ok

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Admin required or ownership denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid body or business rule failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Per-user rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: Wrong HTTP method
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness + capability checklist
      operationId: getHealthz
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Healthz'

  /readyz:
    get:
      tags: [health]
      summary: Readiness (store Ping)
      operationId: getReadyz
      responses:
        '200':
          description: Store ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readyz'
        '503':
          description: Store not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readyz'

  /metrics:
    get:
      tags: [health]
      summary: Prometheus text metrics
      operationId: getMetrics
      description: |
        Lightweight Prometheus exposition.
        When `AI_CLOUDHUB_METRICS_TOKEN` is set, require `Authorization: Bearer <token>`
        or `?token=<token>`.
      responses:
        '200':
          description: Prometheus text format
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP aicloudhub_http_requests_total Authenticated and public HTTP hits tracked
                  # TYPE aicloudhub_http_requests_total counter
                  aicloudhub_http_requests_total 0
        '401':
          description: Metrics token required but missing/invalid

  /v1/runtime/check:
    get:
      tags: [health]
      summary: Runtime host preflight (rclone / FUSE / WinFsp)
      operationId: getRuntimeCheck
      description: Checks the **API process host** environment, not a remote runner.
      responses:
        '200':
          description: Preflight report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeCheck'

  /v1/auth/register:
    post:
      tags: [auth]
      summary: Register user (first user becomes admin)
      description: |
        Disabled when AI_CLOUDHUB_ALLOW_REGISTER=0 except bootstrap (zero users).
        Rate-limited per client IP.
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Registration disabled
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Login and obtain bearer token
      description: IP rate limit + failure lockout (auth.login_fail audit).
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Rate limited or locked after failures

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Exchange refresh_token for new access+refresh (rotation)
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke current access token (optional refresh_token in body)
      operationId: authLogout
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/me:
    get:
      tags: [auth]
      summary: Current user id, username, role (and agent principal fields)
      description: |
        Human tokens return `principal=human`. Agent capability tokens also include
        `agent_id`, `scopes`, and `principal=agent`.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/me/password:
    post:
      tags: [auth]
      summary: Change password
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/admin/users:
    get:
      tags: [admin]
      summary: List all users (admin)
      operationId: adminListUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [admin]
      summary: Create user (admin; for closed registration)
      operationId: adminCreateUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password, minLength: 8 }
                role: { type: string, enum: [admin, user], default: user }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/users/{id}/role:
    post:
      tags: [admin]
      summary: Set user role (admin)
      operationId: adminSetRole
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRole'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  role: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/admin/users/{id}/revoke-sessions:
    post:
      tags: [admin]
      summary: Invalidate all tokens for a user (bump token_version)
      operationId: adminRevokeSessions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: All sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  token_version: { type: integer }
                  status: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/audit:
    get:
      tags: [admin]
      summary: Recent audit events (admin)
      operationId: adminListAudit
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: false
          description: Filter events for one user
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Max events (1–500, default 100)
          schema: { type: integer, default: 100 }
        - name: action
          in: query
          required: false
          description: Filter by audit action (exact match), e.g. auth.login_fail
          schema: { type: string }
      responses:
        '200':
          description: Audit list (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  limit: { type: integer }
                  user_id: { type: string }
                  action: { type: string }

  /v1/admin/policy:
    get:
      tags: [admin]
      summary: External policy file status (admin)
      description: |
        Returns load status for `AI_CLOUDHUB_POLICY_FILE`. Built-in scope/drive/path
        checks always apply. Pass `rules=1` to include the parsed document.
        See docs/POLICY.md.
      operationId: adminGetPolicy
      security:
        - bearerAuth: []
      parameters:
        - name: rules
          in: query
          required: false
          description: "1|true to include full policy document"
          schema: { type: string, enum: ["1", "true", "0", "false"] }
      responses:
        '200':
          description: Policy status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    properties:
                      file_path: { type: string }
                      loaded: { type: boolean }
                      version: { type: integer }
                      mode: { type: string, enum: [enforce, observe] }
                      rule_count: { type: integer }
                      reload_every: { type: string }
                      mod_time: { type: string, format: date-time }
                  document:
                    type: object
                    description: Present when rules=1
                    additionalProperties: true
                  note: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/agents:
    get:
      tags: [agents]
      summary: List agents for current user
      description: |
        Human session only. Agent tokens receive `403 human session required`.
        Returns `{ "items": [Agent, ...] }`. Disabled service returns `404 agents disabled`.
      operationId: listAgents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Agent list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsAgent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Agent token cannot manage agents (human session required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Agents service disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [agents]
      summary: Create agent identity
      description: |
        Human session only. Default scopes are `drive.read` + `drive.write` when omitted.
        `allowed_drive_ids` must belong to the owner when set.
      operationId: createAgent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Agent token cannot manage agents (human session required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Agents service disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/agents/{id}:
    get:
      tags: [agents]
      summary: Get agent by id
      description: Human session only.
      operationId: getAgent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Human session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      tags: [agents]
      summary: Update agent (full/partial body)
      description: |
        Human session only. Same handler as PATCH. When `allowed_drive_ids` is present
        in JSON (including `[]`), the drive allowlist is replaced.
      operationId: putAgent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdate'
      responses:
        '200':
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Human session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags: [agents]
      summary: Patch agent fields
      description: Same as PUT; human session only.
      operationId: patchAgent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdate'
      responses:
        '200':
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Human session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [agents]
      summary: Delete agent
      description: Human session only.
      operationId: deleteAgent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Human session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/agents/{id}/token:
    post:
      tags: [agents]
      summary: Issue agent capability token
      description: |
        Human session only. Agent must be `status=active`. Body may set `scopes` and
        `ttl_min` (minutes; default 60). Omitted scopes use agent `default_scopes`.
        Returned bearer is used like a login token; API scope checks apply
        (`drive.read` / `drive.write` / `job.run` / …).
      operationId: issueAgentToken
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentTokenRequest'
      responses:
        '200':
          description: Capability token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTokenResponse'
        '400':
          description: Agent disabled, unknown scope, or bad body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Human session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

