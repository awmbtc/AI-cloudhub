  /v1/jobs:
    get:
      tags: [jobs]
      summary: List jobs (BYOC queue)
      operationId: listJobs
      description: |
        Returns jobs for the authenticated user. Query `status=pending` lists claimable
        pending/dispatched jobs. Other status values exact-match filter (running, succeeded, …).
        Jobs run on **user runners only** — no platform pool.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, dispatched, running, succeeded, failed, cancelled]
          description: |
            `pending` = claimable set (pending+dispatched). Other values exact match on Job.status.
        - name: agent_id
          in: query
          required: false
          description: Filter by creator agent_id (ignored when status=pending)
          schema: { type: string }
        - name: claimed_by_agent_id
          in: query
          required: false
          description: Filter by claimer agent_id (ignored when status=pending)
          schema: { type: string }
        - name: region
          in: query
          required: false
          description: Only with status=pending — filter region_hint
          schema: { type: string }
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                  agent_id: { type: string }
                  claimed_by_agent_id: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Jobs service disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [jobs]
      summary: Create BYOC job
      operationId: createJob
      description: |
        Enqueues work for the owner's runner. Command executes on BYOC compute;
        note field is annotated with D-001 (no platform large pool).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreate'
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Jobs service disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/jobs/{id}:
    get:
      tags: [jobs]
      summary: Get job by id
      operationId: getJob
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/jobs/{id}/claim:
    post:
      tags: [jobs]
      summary: Claim a specific pending job (BYOC worker)
      description: |
        Requires scope **job.run** for agent tokens. Sets `claimed_by_agent_id` from the
        agent principal when present. Agents may only claim jobs whose drive is allowed
        (allowlist + job.run policy); denied claims are released back to pending.
      operationId: claimJob
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Claimed job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing job.run, drive not allowed for agent, or no claimable job for agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/jobs/next/claim:
    post:
      tags: [jobs]
      summary: Claim oldest pending job for user (BYOC worker)
      description: |
        Path uses id segment `next` with action `claim` (same router as /v1/jobs/{id}/claim).
        Requires scope **job.run** for agent tokens. Skips jobs whose drive the agent cannot access.
      operationId: claimNextJob
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Claimed job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: No pending jobs or claim failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing job.run or no claimable jobs for this agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/jobs/{id}/complete:
    post:
      tags: [jobs]
      summary: Complete a claimed job
      operationId: completeJob
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobComplete'
      responses:
        '200':
          description: Updated job
          content:
            application/json:
              schema:
