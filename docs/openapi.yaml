  /v1/graph:
    get:
      tags: [graph]
      summary: List identity graph edges
      operationId: listGraph
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: subject, in: query, schema: { type: string } }
        - { name: object, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GraphEdge' }
    post:
      tags: [graph]
      summary: Upsert graph edge
      operationId: linkGraph
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [subject, relation, object]
              properties:
                subject: { type: string }
                relation: { type: string }
                object: { type: string }
                meta: { type: object }
