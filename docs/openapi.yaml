              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }

  /v1/connectors:
    get:
      tags: [connectors]
      summary: List connector bindings
      operationId: listConnectors
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ConnectorBinding' }
    post:
      tags: [connectors]
      summary: Register connector (human)
      description: Secrets in config are stripped. Materialization runs on BYOC runner.
      operationId: createConnector
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, example: postgres }
                name: { type: string }
                config: { type: object, additionalProperties: true }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorBinding' }
        '403': { description: Human session required }

  /v1/connectors/{id}:
    get:
      tags: [connectors]
      summary: Get connector
      operationId: getConnector
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorBinding' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [connectors]
      summary: Delete connector (human)
      operationId: deleteConnector
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }
