        - { name: entity, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LineageEvent' }
    post:
      tags: [lineage]
      summary: Record lineage event
      operationId: recordLineage
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [action, entity]
              properties:
                action: { type: string }
                entity: { type: string }
                parent: { type: string }
