        Pass `apply=true` (body or query) to write name/prefix/mount_point/region
        from `payload.drive`. Does **not** restore object bytes or change provider/bucket.
      operationId: restoreDriveSnapshot
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: sid
          in: path
          required: true
          schema: { type: string }
        - name: apply
          in: query
          schema: { type: string, enum: ["1", "true", "0", "false"] }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                apply: { type: boolean }
      responses:
        '200':
          description: Preview or applied result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotRestoreResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/bindings:
    get:
      tags: [bindings]
      summary: List bindings (optional device filter)
      description: |
        Requires scope **drive.read** (agent tokens). Humans are unrestricted.
        For agent tokens, results are filtered to drives on the agent's
        `allowed_drive_ids` allowlist and that pass drive.read policy checks.
        Optional `device_id` filter applies before allowlist filtering.
      operationId: listBindings
      security:
        - bearerAuth: []
      parameters:
        - name: device_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Binding list (agent-visible subset for agent tokens)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsBinding'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing scope drive.read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [bindings]
      summary: Create binding (desired mount on device)
      description: |
        Requires scope **drive.write** (agent tokens). Agents may only bind drives
        on their `allowed_drive_ids` allowlist (and drive.write policy).
      operationId: createBinding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindingCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing scope drive.write or drive not on agent allowlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Binding quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/bindings/{id}:
