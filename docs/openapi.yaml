      operationId: listPurchases
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }

  /v1/purchases/{id}/pay:
    post:
      tags: [purchases]
      summary: Dev pay stub (mark paid)
      operationId: payPurchase
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider_ref: { type: string }
      responses:
