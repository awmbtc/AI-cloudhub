      operationId: stripeWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Purchase updated }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/connectors/catalog:
    get:
      tags: [connectors]
      summary: Connector type catalog
      operationId: connectorsCatalog
      responses:
        '200':
          content:
