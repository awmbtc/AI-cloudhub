# Production-ish control plane only (no platform runner pool — D-001).
# Object storage remains BYOS on the user side.
#
# Required secrets (do not commit real values):
#   export JWT_SECRET="$(openssl rand -hex 32)"
#   export AI_CLOUDHUB_MASTER_KEY="$(openssl rand -base64 32)"
# Optional:
#   export AI_CLOUDHUB_METRICS_TOKEN="$(openssl rand -hex 16)"
#   export AI_CLOUDHUB_ALLOW_REGISTER=0   # after first admin bootstrap
#
# See docs/PRODUCTION.md
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${VERSION:-0.2.9}
    # Prefer loopback when TLS terminates on the host (nginx/Caddy examples).
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      AI_CLOUDHUB_DB: postgres://aihub:aihub@postgres:5432/aihub?sslmode=disable
      AI_CLOUDHUB_REDIS: redis://redis:6379/0
      AI_CLOUDHUB_REDIS_LIMIT: "120"
      AI_CLOUDHUB_REDIS_WINDOW_SEC: "60"
      AI_CLOUDHUB_STRICT: "1"
      # After bootstrap, set AI_CLOUDHUB_ALLOW_REGISTER=0 in the host env / override.
      AI_CLOUDHUB_ALLOW_REGISTER: ${AI_CLOUDHUB_ALLOW_REGISTER:-1}
      AI_CLOUDHUB_MASTER_KEY: ${AI_CLOUDHUB_MASTER_KEY:?set AI_CLOUDHUB_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      AI_CLOUDHUB_METRICS_TOKEN: ${AI_CLOUDHUB_METRICS_TOKEN:-}
      # Distroless healthcheck uses binary subcommand (no curl in image).
      AI_CLOUDHUB_HEALTHCHECK_URL: http://127.0.0.1:8080/healthz
      # Optional policy / OPA (mount files and set paths):
      # AI_CLOUDHUB_POLICY_FILE: /etc/aihub/policy.json
      # AI_CLOUDHUB_OPA_POLICY_FILE: /etc/aihub/authz.rego
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Image is distroless: /api healthcheck dials HEALTHCHECK_URL
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aihub
      POSTGRES_PASSWORD: aihub
      POSTGRES_DB: aihub
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Do not publish 5432 on a public host without a firewall.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihub -d aihub"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
