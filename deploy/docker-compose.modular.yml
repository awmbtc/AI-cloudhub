# Optional multi-process *shape* for Stage C experiments.
# Still the SAME cmd/api binary per process (module filtering via env in future);
# today each replica is a full api — use for HA / horizontal scale of control plane,
# NOT for a platform runner pool (D-001).
#
# Default production remains docker-compose.prod.yml (single api + pg + redis).
#
# Usage:
#   export JWT_SECRET=… AI_CLOUDHUB_MASTER_KEY=…
#   docker compose -f deploy/docker-compose.modular.yml up -d --build
#
# Edge: point nginx/Caddy at api-a:8080 or use a load balancer.

services:
  api-a:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: &api_env
      HTTP_ADDR: ":8080"
      AI_CLOUDHUB_DB: postgres://aihub:aihub@postgres:5432/aihub?sslmode=disable
      AI_CLOUDHUB_REDIS: redis://redis:6379/0
      AI_CLOUDHUB_STRICT: "1"
      AI_CLOUDHUB_ALLOW_REGISTER: ${AI_CLOUDHUB_ALLOW_REGISTER:-1}
      AI_CLOUDHUB_MASTER_KEY: ${AI_CLOUDHUB_MASTER_KEY:?set AI_CLOUDHUB_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      # Optional remote PDP (external process you run)
      # AI_CLOUDHUB_PDP_URL: http://pdp:8181/decide
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    expose:
      - "8080"
    restart: unless-stopped

  api-b:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: *api_env
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    expose:
      - "8080"
    restart: unless-stopped

  # Optional: tiny edge that round-robins (use real LB in prod)
  edge:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.modular.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-a
      - api-b
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aihub
      POSTGRES_PASSWORD: aihub
      POSTGRES_DB: aihub
    volumes:
      - pgdata_mod:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped

volumes:
  pgdata_mod:
